# Action references are pinned to full commit SHAs (the version is the trailing comment).
# Looked up on 2026-10-13 with `git ls-remote https://github.com/actions/<name>`; both tags are
# lightweight tags, so the listed SHA is the commit itself.
#
# No step interpolates github.event.* or github.head_ref into a run: script.
# If one is ever needed, pass it through env: and quote the variable.
#
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python 3.14)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Report tmux version
        run: tmux -V
      - name: Run tests
        run: make test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install linters
        run: python -m pip install "ruff>=0.6" "mypy>=1.10"
      - name: Run lint
        run: make lint
      - name: Report the computed version
        run: |
          {
            echo "### Computed version"
            echo
            echo "- This commit: \`$(python scripts/versioning.py)\`"
            echo "- Next release: \`$(python scripts/versioning.py --next-release)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Validate skills and plugin manifests
        run: PYTHONPATH=src python -m unittest tests.unit.test_skills -v

  repository-checks:
    name: git hooks and documents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Run the git hook tests
        run: PYTHONPATH=src python -m unittest tests.unit.test_git_hooks tests.unit.test_scan_secrets -v
      - name: Check the READMEs
        run: bin/wev readme check
      - name: Check CLAUDE.md
        run: bin/wev claude-md check

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Scan tracked files for credential patterns
        run: python scripts/scan_secrets.py
